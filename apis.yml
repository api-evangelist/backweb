name: BackWeb
description: 'BackWeb Technologies Ltd. was an Israeli-American enterprise software company founded in
  1995 by Eli Barkat, Nir Barkat, Yuval Rakavy, Iftah Sneh and Lior Hass, with offices in Ramat Gan, Israel
  and San Jose, California. BackWeb pioneered "Polite" push technology — background delivery of software
  updates, patches, alerts and marketing content to desktops using only idle bandwidth so it did not disrupt
  the user or the corporate network. Its Polite Communication Server, Offline Access Server, e-Accelerator
  and Proactive Portal products were deployed by Cisco, Hewlett-Packard, IBM, Ericsson, Compaq and SAP,
  and integrators used the BackWeb Server Extension API and BackWeb Automation SDK to publish content from
  external data sources into the Polite server. The company IPO''d on NASDAQ (BWEB) in June 1999 after raising
  roughly $13M privately from investors including Goldman Sachs, Intel and Trinity Ventures, peaking near
  $38M in annual revenue. It never recovered from the dot-com collapse, was delisted from NASDAQ and moved
  to the OTC Bulletin Board, approved a voluntary liquidation in 2012, suspended operations and divested
  its patents in 2014, and began distributing remaining cash to shareholders. BackWeb is defunct: there
  is no operating company, no developer portal, and no live API. The backweb.com domain is a parked Afternic
  for-sale lander. This profile is retained as a historical record only.'
